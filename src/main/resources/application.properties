spring.application.name=flash-sale
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5480/shop}
spring.datasource.username=shop
spring.datasource.password=shop
payments.url=${PAYMENTS_URL:http://localhost:8090}

# Every pool and server limit is left at its Spring Boot 4.1.1 default unless an experiment says otherwise.
management.endpoints.web.exposure.include=health,metrics,prometheus,threaddump
# Publishes Tomcat's thread pool (busy threads) to the metrics endpoint.
server.tomcat.mbeanregistry.enabled=true
